<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Agent - Web UI Preview & Slide Export</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #0f172a;
      --surface-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #a855f7;
      --button-bg: #1e293b;
      --button-hover: #334155;
      --canvas-bg: #050811;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #9333ea;
      --button-bg: #f1f5f9;
      --button-hover: #e2e8f0;
      --canvas-bg: #e2e8f0;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      z-index: 10;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      align-items: center;
      background: var(--button-bg);
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      overflow: hidden;
    }

    button, a.btn {
      background: var(--button-bg);
      color: var(--text);
      border: 1px solid var(--surface-border);
      padding: 7px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-group button {
      border: none;
      border-radius: 0;
      padding: 7px 12px;
      border-right: 1px solid var(--surface-border);
    }

    .btn-group button:last-child {
      border-right: none;
    }

    button:hover, a.btn:hover {
      background: var(--button-hover);
    }

    button.primary, a.btn.primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    button.primary:hover, a.btn.primary:hover {
      background: var(--primary-hover);
    }

    main.viewport {
      flex: 1;
      background: var(--canvas-bg);
      position: relative;
      overflow: hidden;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main.viewport:active {
      cursor: grabbing;
    }

    .canvas-stage {
      transform-origin: center center;
      transition: transform 0.05s linear;
      box-shadow: 0 20px 40px var(--shadow);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      line-height: 0;
    }

    .canvas-stage img {
      max-width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    footer.info-bar {
      background: var(--surface);
      border-top: 1px solid var(--surface-border);
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      z-index: 10;
    }

    footer.info-bar a {
      color: var(--primary);
      text-decoration: none;
    }

    footer.info-bar a:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface-border);
      color: var(--text);
      font-size: 0.7rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="title">Local AI Agent - Web UI Overview</div>
      <div class="subtitle">ภาพหน้าจอส่วนติดต่อผู้ใช้พร้อมระบบส่งออกความละเอียดสูงสำหรับทำสไลด์</div>
    </div>
    <div class="toolbar">
      <div class="btn-group">
        <button id="btn-zoom-out" title="ซูมออก (-)">-</button>
        <button id="btn-zoom-reset" title="รีเซ็ตมุมมอง (100%)">100%</button>
        <button id="btn-zoom-in" title="ซูมเข้า (+)">+</button>
      </div>
      <button id="btn-theme" title="สลับธีม">สลับธีม (Theme)</button>
      <a href="http://localhost:3000" target="_blank" rel="noopener noreferrer" class="btn" title="เปิดหน้าเว็บของจริงที่กำลังรันบน Localhost">
        เปิด Web UI สด (Localhost)
      </a>
      <button id="btn-download-orig" class="btn" title="ดาวน์โหลดไฟล์รูปภาพต้นฉบับ">
        Download Original PNG
      </button>
      <button id="btn-export-hd" class="primary" title="ส่งออกภาพแบบความหนาแน่นสูง 2x สำหรับนำไปวางในสไลด์">
        Export HD PNG (2x For Slides)
      </button>
    </div>
  </header>

  <footer class="info-bar">
    <div>
      <span class="badge">ขนาดต้นฉบับ: 1024 x 462 px</span>
      <span style="margin-left: 8px;">คลิกและลากเมาส์เพื่อเลื่อนมุมมอง | หมุนลูกกลิ้งเมาส์เพื่อซูมเข้า-ออก</span>
    </div>
    <div>
      <span>ระบบขยายภาพความละเอียดสูง: <strong>2048 x 924 px</strong> ผ่าน Canvas Render</span>
    </div>
  </footer>

  <script>
    (function () {
      const stage = document.getElementById('stage');
      const viewport = document.getElementById('viewport');
      const img = document.getElementById('preview-img');
      const zoomResetBtn = document.getElementById('btn-zoom-reset');
      const zoomInBtn = document.getElementById('btn-zoom-in');
      const zoomOutBtn = document.getElementById('btn-zoom-out');
      const themeBtn = document.getElementById('btn-theme');
      const exportHdBtn = document.getElementById('btn-export-hd');
      const downloadOrigBtn = document.getElementById('btn-download-orig');

      let scale = 1;
      let panX = 0;
      let panY = 0;
      let isDragging = false;
      let startX = 0;
      let startY = 0;

      function updateTransform() {
        stage.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
        zoomResetBtn.textContent = Math.round(scale * 100) + '%';
      }

      function zoom(factor) {
        scale = Math.max(0.3, Math.min(4.0, scale * factor));
        updateTransform();
      }

      zoomInBtn.addEventListener('click', () => zoom(1.2));
      zoomOutBtn.addEventListener('click', () => zoom(0.833));
      zoomResetBtn.addEventListener('click', () => {
        scale = 1;
        panX = 0;
        panY = 0;
        updateTransform();
      });

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        zoom(factor);
      }, { passive: false });

      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // Theme toggle
      themeBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
      });

      // Download original
      downloadOrigBtn.addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = img.src;
        a.download = 'local-ai-agent-web-ui.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      });

      // Export HD (2x Canvas Supersampling)
      exportHdBtn.addEventListener('click', () => {
        exportHdBtn.disabled = true;
        exportHdBtn.textContent = 'กำลังประมวลผล...';

        setTimeout(() => {
          try {
            const canvas = document.createElement('canvas');
            const targetScale = 2;
            canvas.width = (img.naturalWidth || 1024) * targetScale;
            canvas.height = (img.naturalHeight || 462) * targetScale;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'local-ai-agent-web-ui-hd-2048x924.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          } catch (err) {
            alert('ไม่สามารถส่งออกภาพได้: ' + err.message);
          } finally {
            exportHdBtn.disabled = false;
            exportHdBtn.textContent = 'Export HD PNG (2x For Slides)';
          }
        }, 50);
      });
    })();
  </script>
