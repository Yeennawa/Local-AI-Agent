<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Local AI Agent</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app-container">

    <header class="app-header">
      <h1>Local AI Agent</h1>
    </header>

    <form class="prompt-form" id="prompt-form">
      <input
        type="text"
        id="prompt-input"
        name="prompt"
        placeholder="พิมพ์อะไรสักหน่อย"
        maxlength="1000"
        autocomplete="off"
        required
      >
      <button type="submit" id="send-button">
        ส่ง
      </button>
    </form>

    <section class="ai-panel" aria-live="polite">

      <div class="ai-profile">

        <div class="ai-character neutral" id="ai-character" aria-hidden="true">
          <div class="character-antenna"></div>

          <div class="character-face">
            <span class="character-eye"></span>
            <span class="character-eye"></span>
          </div>
        </div>

        <div class="ai-information">
          <h2>Local AI</h2>
          <p>พร้อมช่วยตอบคำถาม</p>
        </div>

        <div class="model-switcher" id="model-switcher" role="group" aria-label="เลือกโหมดโมเดล AI">
          <button type="button" class="mode-button active" data-mode="lite" id="mode-lite-btn" title="โหมดประหยัด RAM (1.5B)">
            Lite (1.5B)
          </button>
          <button type="button" class="mode-button" data-mode="advanced" id="mode-advanced-btn" title="โหมดประสิทธิภาพสูง (3B)">
            Adv (3B)
          </button>
        </div>

        <button type="button" class="new-chat-button" id="new-chat-button">
          แชตใหม่
        </button>

        <span class="status-badge" id="model-status-badge">
          Lite Ready
        </span>

      </div>

      <div class="chat-feed" id="chat-feed" role="log" aria-live="polite"></div>

    </section>

  </main>

  <script src="app.js"></script>
</body>

</html>
